name: Release

# Pushing a tag v* builds, scans and publishes the release: images on
# GHCR, then a DRAFT release with every asset (binaries, SBOM, VEX,
# LICENSE, SHA256SUMS), which is published only once complete. This works
# with GitHub immutable releases: a published release is never modified.
# Release notes come from docs/releases/<tag>.md (generated if missing).
# Running it by hand only builds, so the pipeline can be checked without
# publishing anything.
#
# Gate: every binary is scanned with govulncheck before anything is
# attested or published, and the images are built from those same
# scanned binaries. A known vulnerability stops the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      go-version:
        description: Go toolchain (build-only runs; e.g. to test the gate)
        default: "1.26.x"

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
      # Releases are built with a supported Go (security fixes in the
      # standard library); go.mod only sets the minimum for source builds.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version || '1.26.x' }}
          check-latest: true # always the newest patch (security fixes)
      - run: go test ./...
      - name: Build
        run: scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Vulnerability gate (govulncheck on every binary)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          scripts/vulncheck-binaries.sh dist/expiry-radar-*
      # SBOM (CycloneDX) and VEX (OpenVEX from govulncheck) per binary,
      # listed in SHA256SUMS (OpenSSF OSPS-QA-02.02, OSPS-VM-04.02).
      - name: SBOM and VEX
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          for f in dist/expiry-radar-*; do
            cyclonedx-gomod bin -json -output "$f.cdx.json" "$f"
            govulncheck -mode=binary -format=openvex "$f" > "$f.vex.json"
          done
          (cd dist && sha256sum expiry-radar-* > SHA256SUMS)
      - uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: dist/expiry-radar-*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: binaries
    strategy:
      matrix:
        target: [collector, agent]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Image context from the scanned binaries
        run: |
          mkdir -p ctx/data
          for a in amd64 arm64; do
            cp dist/expiry-radar-${{ matrix.target }}-*-linux-$a ctx/${{ matrix.target }}-linux-$a
          done
          ls -l ctx
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/joao-paulino/expiry-radar-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: ctx
          file: Dockerfile.release
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Release assets go up last: only after the gate passed and the
  # images were pushed.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Draft first, every asset attached, then publish: a published
        # release is never modified (immutable releases).
        # LICENSE ships with every release (OpenSSF OSPS-LE-03.02).
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cp LICENSE dist/LICENSE
          notes=(--generate-notes)
          if [ -f "docs/releases/${tag}.md" ]; then notes=(--notes-file "docs/releases/${tag}.md"); fi
          if state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" != "true" ]; then
              echo "::error::release $tag is already published; publish by pushing the tag, not from the UI"
              exit 1
            fi
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --draft --verify-tag --title "$tag" "${notes[@]}"
          fi
          gh release edit "$tag" --draft=false
