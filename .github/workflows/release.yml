name: Release

# A tag v* (pushed, or created by publishing a release in the GitHub
# UI) publishes the release assets (binaries, SHA256SUMS, provenance)
# and multi-arch images on GHCR. Running it by hand only builds, so the
# pipeline can be checked without publishing anything.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

# A release published in the UI fires both events; run them one at a time.
concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
      # Releases are built with a supported Go (security fixes in the
      # standard library); go.mod only sets the minimum for source builds.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: go test ./...
      - name: Build
        run: scripts/build-release.sh "${GITHUB_REF_NAME}"
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: dist/expiry-radar-*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Create the release, or add the assets if it was created in the UI.
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag \
            || gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: dist
          path: dist/

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [collector, agent]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/joao-paulino/expiry-radar-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
