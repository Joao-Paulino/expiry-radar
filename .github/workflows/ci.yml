name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test ./...

  distros:
    # Runs the real agent on RedHat-family (Rocky 9), Debian 12 and Arch
    # against a real collector and a real STARTTLS SMTP server (Mailpit).
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/ci/distro-smoke.sh

  vault:
    # Runs the Vault checker against a real Vault (dev mode, TLS) with a
    # PKI mount and an AppRole limited to the README's policy.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/ci/vault-smoke.sh
