name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test ./...

  distros:
    # Runs the real agent on RedHat-family (Rocky 9), Debian 12 and Arch
    # against a real collector and a real STARTTLS SMTP server (Mailpit).
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/ci/distro-smoke.sh

  vault:
    # Runs the Vault checker against a real Vault (dev mode, TLS) with a
    # PKI mount and an AppRole limited to the README's policy.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/ci/vault-smoke.sh

  azure:
    # Runs the Azure checker against a real Key Vault. GitHub Actions is
    # the workload identity (federated credential, no stored secret).
    # Skipped unless the repository variables are set (see README).
    if: vars.AZURE_TEST_CLIENT_ID != ''
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: GitHub OIDC token for Entra ID
        run: |
          curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            | jq -r .value > "${RUNNER_TEMP}/azure-token"
      - run: go test -count=1 -tags integration -run TestIntegration_Azure -v ./internal/checker/azure/
        env:
          AZURE_TEST_TENANT_ID: ${{ vars.AZURE_TEST_TENANT_ID }}
          AZURE_TEST_CLIENT_ID: ${{ vars.AZURE_TEST_CLIENT_ID }}
          AZURE_TEST_VAULT: ${{ vars.AZURE_TEST_VAULT }}
          AZURE_TEST_TOKEN_FILE: ${{ runner.temp }}/azure-token

  vulns:
    # Fails when the code calls a known-vulnerable function, in a
    # dependency or in the standard library of the Go used for releases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true # always the newest patch (security fixes)
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
