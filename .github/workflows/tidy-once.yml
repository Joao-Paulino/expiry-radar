name: tidy-once
on:
  push:
    branches: [fix/release-gate]
    paths: [".github/workflows/tidy-once.yml"]
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
      - run: |
          go get golang.org/x/sys@v0.44.0
          go mod tidy
          git diff go.mod
          go build ./... && go test ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -show verbose ./... | tail -15
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): golang.org/x/sys v0.44.0 (GO-2026-5024); Go 1.25 minimum"
          git push origin HEAD:fix/release-gate
