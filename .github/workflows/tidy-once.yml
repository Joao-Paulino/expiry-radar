# One-off: update vulnerable dependencies on a runner with internet access.
name: tidy-once
on:
  push:
    branches: [fix/deps-vulns]
    paths: [".github/workflows/tidy-once.yml"]
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          go get github.com/coreos/go-oidc/v3@v3.17.0 github.com/go-jose/go-jose/v4@v4.1.9
          go mod tidy
          go build ./... && go test ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./... || true
          git diff go.mod
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): go-oidc v3.17.0, go-jose v4.1.9 (security fixes; drops x/crypto)"
          git push origin HEAD:fix/deps-vulns
