# One-off: drop the sandbox-only replace directive and tidy go.mod on a
# runner with normal internet access. Removed again once it has run.
name: tidy-once

on:
  push:
    branches: [chore/go-mod-tidy]

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Drop replace and tidy
        run: |
          go mod edit -dropreplace golang.org/x/sys
          go mod tidy
          go vet ./...
          go test ./...
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git diff --cached --quiet && exit 0
          git commit -m "chore: drop sandbox replace directive and tidy go.mod"
          git push origin HEAD:chore/go-mod-tidy
