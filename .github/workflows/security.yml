# Security testing beyond unit tests, mapped to OWASP Top 10 and the
# CWE Top 25:
#   codeql  SAST, semantic data-flow analysis (security-extended queries)
#   gosec   Go-specific SAST rules (crypto, file permissions, SQL, ...)
#   zap     DAST, OWASP ZAP spider + active scan against a real collector
#   fuzz    Go native fuzzing of every parser that sees external input
# Results of codeql and gosec appear under Security > Code scanning.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, to catch new CodeQL queries and ZAP rules

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-extended
      - run: go build ./...
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-go
          output: codeql-results
      - name: CodeQL findings (gate)
        # Fails on any finding except the reviewed, accepted ones listed in
        # .github/codeql-accepted.txt as "<rule> <path>" with a reason.
        run: |
          jq -r '.runs[].results[] | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) | \(.message.text[0:160])"' codeql-results/*.sarif | sort | uniq | tee findings.txt
          new=0
          while read -r rule loc _; do
            path=${loc%%:*}
            if ! grep -q "^$rule $path " .github/codeql-accepted.txt; then echo "::error file=$path::new CodeQL finding: $rule at $loc"; new=1; fi
          done < findings.txt
          exit $new

  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
      - name: gosec (gate)
        # Fails on any finding not suppressed with a justified #nosec;
        # the SARIF copy goes to the Security tab either way.
        run: gosec -fmt sarif -out gosec.sarif -stdout -verbose text ./...
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/ci/zap-scan.sh
        env:
          FAIL_ON: Medium
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: |
            zap/*.html
            zap/*.json
            zap/*.md

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fuzz each external parser for 30s
        run: |
          set -e
          for t in \
            "FuzzHandler ./internal/collector/ingest/" \
            "FuzzSanitize ./internal/logging/" \
            "FuzzReadCertFile ./internal/checker/local/" \
            "FuzzLeafFromPublicCertData ./internal/checker/azure/" \
            "FuzzSafeResourceID ./internal/checker/azure/" \
            "FuzzLeafOf ./internal/checker/vmware/" \
            "FuzzParseGetEndpointsResponse ./internal/checker/opcua/" \
            "FuzzParse ./internal/checker/inventory/"; do
            set -- $t
            echo "::group::$1"
            go test -run '^$' -fuzz "^$1\$" -fuzztime 30s "$2"
            echo "::endgroup::"
          done
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
