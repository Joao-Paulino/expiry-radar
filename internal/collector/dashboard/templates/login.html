<!DOCTYPE html>
<html lang="en" data-theme="{{.Theme}}">
<head>{{template "head"}}<title>Expiry Radar · Sign in</title></head>
<body>
<div class="login-wrap">
<div class="login">
<div class="brand"><span class="logo" aria-hidden="true"></span>Expiry Radar</div>
{{if .Error}}<p class="alert" role="alert">{{.Error}}</p>{{end}}
<form method="post" action="/login" autocomplete="off">
<label>Password / Palavra-passe<input type="password" name="password" required autofocus></label>
<label>Authenticator or recovery code / Código do autenticador ou de recuperação<input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" required></label>
<button type="submit" class="primary">Sign in / Entrar</button>
</form>
{{if .Buttons}}<p class="or">or / ou</p>
<div class="sso">{{range .Buttons}}<a class="btn" href="{{.URL}}">Sign in with {{.Label}} / Entrar com {{.Label}}</a>
{{end}}</div>{{end}}
</div>
</div>
</body>
</html>
